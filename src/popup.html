<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Mail Checker for Bulwark</title>
<style>
  html, body { margin: 0; width: var(--width, 599px); height: 600px; background: var(--background, transparent); overflow: hidden; }
  #loading { position: absolute; inset: 0; margin: auto; width: 48px; height: 48px; visibility: hidden; animation: pulse 1.2s ease-in-out infinite; }
  /* A mid grey, because the remembered background can be light or dark. */
  #connection { position: absolute; top: calc(50% + 40px); left: 0; right: 0; padding: 0 24px; text-align: center; font: 14px system-ui, sans-serif; color: #767676; }
  #connection p { margin: 0 0 4px; }
  #connection a { color: inherit; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; pointer-events: none; }
  iframe.loaded { opacity: 1; pointer-events: auto; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { #loading { animation: none; } }
</style>
<img id="loading" alt="Loading">
<div id="connection">
  <p id="trouble" role="status"></p>
  <p id="retry" role="timer"></p>
  <a id="open-tab" target="_blank" rel="noopener" hidden>Open in a tab</a>
</div>
<iframe id="mail" title="Bulwark mail"></iframe>
<script src="popup.js"></script>
